[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "schemaextract-mcp"
version = "1.0.0"
description = "SchemaExtract MCP — Deterministic Financial Document Extraction, Math Reconciliation & Multi-Tab Excel/QuickBooks Export Connector for Claude & ChatGPT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "openpyxl>=3.1.2",
    "httpx>=0.26.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
